# PATCHED (MAReasoning, Exp5) 2026-10-02 -- the UPSTREAM train/config.yaml (kept verbatim as train/config.yaml.upstream) with
# exactly three kinds of change, each tagged:
#   [HW]   our hardware: 2x A100 80GB instead of 8 GPUs -> FSDP2 CPU offload, micro-batch 1, dynamic batching, rollout util 0.5,
#          5-step checkpoints (92 GB each), 100 training steps instead of 5 epochs over 182k questions.
#   [KEY]  no paid API keys: DashScope Qwen2.5-7B-Instruct -> the same model served locally (mds2); gpt-4o-mini tool engine ->
#          Qwen2.5-7B-Instruct (the repo's own documented no-DashScope alternative); Google Search tool off (needs GOOGLE_API_KEY);
#          gpt-4o judge -> Qwen2.5-7B-Instruct with the unchanged rubric (train/utils.py).
#   [LOG]  wandb offline, verbosity INFO.
# Everything else is upstream: Qwen2.5-7B-Instruct planner, lr 1e-6, KL 0.001, clip 0.2/0.3, batch 32 x 8, max_prompt 18432,
# max_response 2048, TOOL_STEPS 3, temperatures 0.7/0.0, 16 workers, 3 tools (Base_Generator, Python_Coder, Wikipedia).
env:
  CUDA_VISIBLE_DEVICES: '0,1'                 # [HW] upstream '0,1,2,3,4,5,6,7'
  HYDRA_FULL_ERROR: 1
  N_GPUS: 2                                   # [HW] upstream 8
  BASE_MODEL: 'Qwen/Qwen2.5-7B-Instruct'
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'exp5_upstream_qwen25_7b'
  PROJECT_NAME: 'MAReasoning'                   # [LOG] wandb project (alirezasakhaeirad/MAReasoning); checkpoints keep their literal path below
  BASE_DATA_DIR: 'data'
  VERBOSITY: 'INFO'                           # [LOG] upstream DEBUG
  N_WORKERS: 16
  ENABLE_TOOLS: ["Base_Generator_Tool","Python_Coder_Tool","Wikipedia_Search_Tool"]                               # [KEY] Google_Search_Tool removed
  TOOL_ENGINE: ["vllm-Qwen/Qwen2.5-7B-Instruct","vllm-Qwen/Qwen2.5-7B-Instruct","vllm-Qwen/Qwen2.5-7B-Instruct"]  # [KEY] upstream gpt-4o-mini / dashscope coder / Default
  MODEL_ENGINE: ["trainable","vllm-Qwen/Qwen2.5-7B-Instruct","vllm-Qwen/Qwen2.5-7B-Instruct","vllm-Qwen/Qwen2.5-7B-Instruct"]  # [KEY] upstream gpt-4o-mini x3 (paper: dashscope Qwen2.5-7B)
  VLLM_BASE_URL: 'http://mds1srv2.epfl.ch:8000/v1'   # [KEY] where the local Qwen2.5-7B-Instruct is served (factory.py honours it)
  VLLM_API_KEY: 'dummy-token'
  JUDGE_MODEL: 'Qwen/Qwen2.5-7B-Instruct'    # [KEY] train/utils.py
  JUDGE_URL: 'http://mds1srv2.epfl.ch:8000/v1'
  HF_HOME: '/data/sakhaei/hf'
  WANDB_MODE: 'online'                        # [LOG] key in ~/.netrc on mds1 (api.wandb.ai)
  WANDB_ENTITY: 'alirezasakhaeirad'          # [LOG]
  WANDB_RUN_ID: '82aiyxat'                   # [LOG] fixed id: every supervisor restart resumes the SAME wandb run
  WANDB_RESUME: 'allow'                       # [LOG]
  WANDB_DIR: '/data/sakhaei/runs/wandb'
  TOOL_STEPS: 3
  TEST_TEMPERATURE: 0.0
  TRAIN_TEMPERATURE: 0.7
  OUTPUT_TYPE: "direct"
  AGENT_MAX_TIMEOUT: 500

python_args:
  agentflow.port: 9999
  algorithm.adv_estimator: 'grpo'
  data.train_files: '${BASE_DATA_DIR}/train/combined_train.parquet'
  data.val_files: '${BASE_DATA_DIR}/val/aime24.parquet'
  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'
  data.train_batch_size: 32
  actor_rollout_ref.rollout.n: 8
  actor_rollout_ref.actor.ppo_mini_batch_size: 8
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1          # [HW] upstream 4
  actor_rollout_ref.actor.use_dynamic_bsz: True                      # [HW]
  actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 20480           # [HW] = max_prompt + max_response
  actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu: 20480    # [HW]
  actor_rollout_ref.ref.log_prob_max_token_len_per_gpu: 20480        # [HW]
  actor_rollout_ref.actor.entropy_from_logits_with_chunking: True    # [HW]
  actor_rollout_ref.ref.entropy_from_logits_with_chunking: True      # [HW]
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 2     # [HW] upstream 4
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 2         # [HW] upstream 4
  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.model.path: '${BASE_MODEL}'
  data.max_prompt_length: 18432
  data.max_response_length: 2048
  data.truncation: 'truncate'
  actor_rollout_ref.rollout.max_model_len: 20480                     # [HW] explicit = prompt + response
  actor_rollout_ref.rollout.max_num_batched_tokens: 8192             # [HW]
  trainer.val_before_train: True
  actor_rollout_ref.actor.optim.lr: 1e-6
  actor_rollout_ref.model.use_remove_padding: True
  actor_rollout_ref.actor.use_kl_loss: True
  actor_rollout_ref.actor.kl_loss_coef: 0.001
  actor_rollout_ref.actor.entropy_coeff: 0.0
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  actor_rollout_ref.model.enable_gradient_checkpointing: True
  actor_rollout_ref.actor.strategy: fsdp2                            # [HW] upstream default fsdp (no offload) on 8 GPUs
  actor_rollout_ref.actor.fsdp_config.offload_policy: True           # [HW]
  actor_rollout_ref.actor.fsdp_config.param_offload: False
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: False
  actor_rollout_ref.model.enable_activation_offload: True            # [HW]
  actor_rollout_ref.rollout.name: 'vllm'
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.5              # [HW] upstream 0.6
  actor_rollout_ref.ref.fsdp_config.param_offload: True              # [HW] upstream False
  algorithm.use_kl_in_reward: False
  trainer.critic_warmup: 0
  trainer.logger: ['console','wandb']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.nnodes: 1
  trainer.save_freq: 5                                               # [HW] upstream 2 (92 GB per checkpoint)
  trainer.max_actor_ckpt_to_keep: 3                                  # [HW]
  trainer.test_freq: 10                                              # [HW] upstream 2
  trainer.total_epochs: 1                                            # [HW] upstream 5
  trainer.total_training_steps: 100                                  # [HW] upstream: none (5 epochs)
  trainer.default_local_dir: '/data/sakhaei/ckpt/AgentFlow_mds/${EXPERIMENT_NAME}'
