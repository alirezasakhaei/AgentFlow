# PATCHED (MAReasoning) 2026-09-23 -- Flow-GRPO on mds1 (2x A100 80GB) with helpers on mds2 (H100).
# Same knobs as upstream train/config.yaml except: 2 GPUs, local helper vLLM instead of gpt-4o-mini
# / DashScope, Wikipedia instead of Google (no paid keys), rule-based reward (train/utils.py),
# thinking disabled for Qwen3-family, optimizer offload so an 8-9B actor fits on two cards.
# Select with AGENTFLOW_TRAIN_CONFIG=train/config_mds.yaml; BASE_MODEL is the one line to swap.
env:
  CUDA_VISIBLE_DEVICES: '0,1'
  HYDRA_FULL_ERROR: 1
  N_GPUS: 2
  BASE_MODEL: 'Qwen/Qwen3-8B'
  HELPER_MODEL: 'vllm-Qwen/Qwen3-8B-helper'
  VLLM_BASE_URL: 'http://mds1srv2.epfl.ch:8000/v1'   # frozen helpers + tool engines (mds2)
  VLLM_API_KEY: 'dummy-token'
  AGENTFLOW_DISABLE_THINKING: '1'
  REWARD_MODE: 'judge'            # judge = Qwen3-30B-A3B on mds2:8001 (train/judge.py), rule = train/utils.py only
  JUDGE_URL: 'http://mds1srv2.epfl.ch:8001/v1/chat/completions'
  JUDGE_MODEL: 'Qwen/Qwen3-30B-A3B-judge'
  HF_HOME: '/data/sakhaei/hf'
  WANDB_MODE: 'offline'          # local wandb runs only, synced by hand if ever
  WANDB_DIR: '/data/sakhaei/runs/wandb'
  ROLLOUT_TP_SIZE: 1
  EXPERIMENT_NAME: 'smoke_qwen3_8b'
  PROJECT_NAME: 'AgentFlow_mds'
  BASE_DATA_DIR: 'data'
  VERBOSITY: 'INFO'
  N_WORKERS: 16
  ENABLE_TOOLS: ["Base_Generator_Tool","Python_Coder_Tool","Wikipedia_Search_Tool"]
  TOOL_ENGINE: ["vllm-Qwen/Qwen3-8B-helper","vllm-Qwen/Qwen3-8B-helper","vllm-Qwen/Qwen3-8B-helper"]
  MODEL_ENGINE: ["trainable","vllm-Qwen/Qwen3-8B-helper","vllm-Qwen/Qwen3-8B-helper","vllm-Qwen/Qwen3-8B-helper"]
  TOOL_STEPS: 3
  TEST_TEMPERATURE: 0.0
  TRAIN_TEMPERATURE: 0.7
  OUTPUT_TYPE: "direct"
  AGENT_MAX_TIMEOUT: 500

python_args:
  agentflow.port: 9999
  algorithm.adv_estimator: 'grpo'
  data.train_files: '${BASE_DATA_DIR}/train/combined_train.parquet'
  data.val_files: '${BASE_DATA_DIR}/val/aime24.parquet'
  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  trainer.n_gpus_per_node: '${N_GPUS}'
  data.train_batch_size: 4
  actor_rollout_ref.rollout.n: 4
  actor_rollout_ref.actor.ppo_mini_batch_size: 4
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 2
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 2
  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  actor_rollout_ref.model.path: '${BASE_MODEL}'
  data.max_prompt_length: 12288
  data.max_response_length: 2048
  data.truncation: 'truncate'
  actor_rollout_ref.rollout.max_model_len: 14336
  actor_rollout_ref.rollout.max_num_batched_tokens: 14336
  trainer.val_before_train: False
  actor_rollout_ref.actor.optim.lr: 1e-6
  actor_rollout_ref.model.use_remove_padding: True
  actor_rollout_ref.actor.use_kl_loss: True
  actor_rollout_ref.actor.kl_loss_coef: 0.001
  actor_rollout_ref.actor.entropy_coeff: 0.0
  actor_rollout_ref.actor.clip_ratio_low: 0.2
  actor_rollout_ref.actor.clip_ratio_high: 0.3
  actor_rollout_ref.model.enable_gradient_checkpointing: True
  actor_rollout_ref.actor.fsdp_config.param_offload: False
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: True
  actor_rollout_ref.ref.fsdp_config.param_offload: True
  actor_rollout_ref.rollout.name: 'vllm'
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.6
  algorithm.use_kl_in_reward: False
  trainer.critic_warmup: 0
  trainer.logger: ['console','wandb']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.nnodes: 1
  trainer.save_freq: -1
  trainer.test_freq: -1
  trainer.total_epochs: 1
  trainer.total_training_steps: 2
  trainer.default_local_dir: '/data/sakhaei/ckpt/${PROJECT_NAME}/${EXPERIMENT_NAME}'
